# Categories of the release notes generated by GitHub (used by
# .github/workflows/release.yml through `gh release create --generate-notes`).
# A PR goes in the first category matching one of its labels.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ⚠️ Breaking changes
      labels: [breaking-change]
    - title: ✨ Features
      labels: [feature]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: ⚡ Performance
      labels: [performance]
    - title: 🧰 Maintenance
      labels: [refactor, docs, ci, build, dependencies]
    - title: Other changes
      labels: ["*"]
