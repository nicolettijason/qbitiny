name: Labeler

# Labels each PR from its branch name (.github/labeler.yml), so that the
# release notes are sorted into categories (.github/release.yml).
on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
