name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-checks (tsc -b) then bundles with Vite.
      - name: Build
        run: npm run build

      # The codebase still has pre-existing lint errors: report them without
      # failing the job until they are cleaned up.
      - name: Lint
        run: npm run lint
        continue-on-error: true
